name: LetMeAsk
main: com.cubex.quiz.QuizPlugin
version: 1.1.0
api-version: "1.20"
description: "在聊天栏出题的抢答活动插件（支持 Vault 经济，集成人机验证）"
authors:
  - Generated
softdepend:
  - HumanVerify
  - CMI
  - Vault

commands:
  letmeask:
    description: "答题活动（查询: top|stats|status；管理: start|stop|question|reload）"
    usage: "/letmeask <top|stats|status|start|stop|question|reload>"
    permission: letmeask.use

permissions:
  letmeask.use:
    description: "使用 LetMeAsk 查询命令（top/stats/status）"
    default: true
  letmeask.admin:
    description: "管理 LetMeAsk 插件"
    default: op
