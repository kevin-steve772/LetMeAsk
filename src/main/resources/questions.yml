# LetMeAsk 题库，支持两种格式（可混用）：
# 1. 纯字符串："题目=答案"，多答案用 | 分隔，答对任一即可
# 2. map：{q: 题目, a: 答案, weight: 权重}，权重越大越容易被抽中（默认 1，范围 1~10000）
#
# 题目或答案本身要含 = 或 : 时，用 \= 、\: 转义，\\ 表示一个反斜杠；
# 分隔符取第一个未被转义的 =（没有 = 才用 :），所以题目里的 = 必须转义。
# 注意 YAML 双引号里反斜杠是转义符，含 \ 的条目请用单引号（单引号内不转义）：
#   - '2+2\=4 这个等式成立吗=成立'
questions:
  - "中国首都=北京"
  - "2+2=4"
  - "香蕉是什么颜色=黄色|黄"
  - "太阳从哪边升起=东|东方|东部"
  - {q: "太阳系最大的行星是什么", a: "木星|Jupiter", weight: 2}
