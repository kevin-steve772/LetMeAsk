# LetMeAsk 基础配置
# payer: 扣款玩家标识（支持玩家名或 UUID）
#   - 玩家名（例如: Kevin）
#   - UUID（例如: 123e4567-e89b-12d3-a456-426614174000）
#   - littleskin:<uuid> 或 littleskin:<name>（如果你使用 LittleSkin 或类似插件）
#   - Server 或 Console 表示由服务器出资（仅当经济插件支持该账户名时可用）
# reward: 每题奖励金额
# question-interval-seconds: 自动出题间隔（秒）
# anti-bot-threshold-seconds: 回答速度（秒）小于等于该值会触发人机验证
# anti-bot-chat-history-count: 答对时检查最近多少条聊天消息（范围 3~20，窗口填满后才判定）
# anti-bot-chat-min-interval-seconds: 最近完整窗口中所有相邻间隔都低于该秒数才踢出；0=禁用
# fuzzy-similarity-threshold: 0-1，答案相似度阈值，越高越严格
# question-timeout-seconds: 答题超时时间（秒），超时后公布答案并出下一题；设置为 0 禁用

payer: Server
reward: 50.0
# 语言：zh=中文（默认），en=英文（读下方 messages-en 段，可自行覆盖）
language: zh
# 自动出题间隔（秒），最小 5 秒
question-interval-seconds: 60
question-timeout-seconds: 30
# 回答用时（秒，支持小数）小于等于该值会触发人机验证
anti-bot-threshold-seconds: 1
# 答对时检查本轮题目期间最近 3 条消息（窗口未填满不触发；全部相邻间隔都低于 0.5 秒才踢出）
anti-bot-chat-history-count: 3
anti-bot-chat-min-interval-seconds: 0.5
# 人机验证服务不可用（未安装 HumanVerify）时的策略：
#   deny  = 拒绝发奖并作废本轮（默认，防止脚本绕过验证刷奖励）
#   award = 降级为直接发奖（旧行为；装有脚本风险的奖励服请勿使用）
anti-bot-verify-unavailable: deny
# 答错反馈：只提示本人，冷却秒内不重复提示；enabled 设 false 关闭
wrong-feedback:
  enabled: true
  cooldown-seconds: 5
# 同一玩家连续答对达到此次数时触发人机验证；设置为 0 可禁用此条件
anti-bot-correct-answer-threshold: 3
# 连击统计时间窗口（秒）：超过该时间未答对则连击清零；0=不清零
anti-bot-streak-window-seconds: 300
# 人机验证超时（秒）：回调长时间未返回时自动解锁并作废本轮，最小 10 秒
verify-timeout-seconds: 120
# 出题因资金不足暂停后，每隔多少秒复查一次出资人余额；最小 5 秒
balance-retry-seconds: 30
# 0-1，答案相似度阈值，越高越严格；1.0 = 严格精确匹配
fuzzy-similarity-threshold: 0.75
# 定时广播排行榜：enabled 设为 false 关闭；minutes 最小 1 分钟；count 最多 20 条
leaderboard-broadcast:
  enabled: true
  minutes: 60
  count: 10

# 物品奖励：与金币叠加发放，背包满掉在脚下
# random-one: true=每次随机其一，false=全发；name/lore/enchantments 可选
items:
  enabled: false
  random-one: false
  list:
    - {material: DIAMOND, amount: 2}
    - {material: GOLD_INGOT, amount: 1, name: "&6幸运金锭", lore: ["&7答题奖励"], enchantments: {luck: 1}}

# 答对庆祝特效：只给答对者发 Title，音效全服可听
# sound 为 Bukkit Sound 枚举名，设为 none 可关闭音效
celebrate:
  enabled: true
  title: "&6&l答对了！"
  subtitle: "&e+{reward} 金币"
  sound: ENTITY_PLAYER_LEVELUP
  volume: 1.0
  pitch: 1.0

# 出题/答题广播的展示通道：
#   chat      = 聊天栏（默认，与原行为完全一致）
#   actionbar = 动作栏（题目存活期间每秒重发，不会被 2~3 秒后消失吞掉）
#   title     = 标题（消息作为大标题，副标题留空）
#   both      = 聊天栏 + 动作栏
# 动作栏与标题由数据包层直接发给客户端，不经过聊天管线，聊天类插件（PlayerChat 等）拦不到。
# 如果主服出现「OP 能看到题目、普通玩家看不到」，把这里改成 actionbar 或 both 即可。
broadcast-mode: chat

# 消息前缀，支持 Bukkit 颜色代码（例如 &b[答题]）
