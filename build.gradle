plugins {
    id 'java'
}

group = 'com.cubex'
// 版本唯一来源：pom.xml 的 <revision>，Gradle 自动跟随，无需手动同步
version = new XmlParser().parse('pom.xml').properties.revision.text()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly files('libs/paper-api.jar')
    compileOnly files('libs/annotations.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    filesMatching('plugin.yml') {
        expand(revision: project.version)
    }
}

jar {
    archiveBaseName.set('LetMeAsk')
    archiveVersion.set(project.version.toString())
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
