# QuizPlugin 配置示例
# payer: 从哪个玩家扣款（玩家名）
# reward: 每题奖励金额（被扣玩家扣除，答对玩家获得）
# question-interval-seconds: 每隔多少秒尝试出题（如果当前已有题或暂停则跳过）
# anti-bot-threshold-seconds: 回答时间小于等于该值会触发人机验证

payer: Server
reward: 50.0
question-interval-seconds: 60
anti-bot-threshold-seconds: 1

# 题目列表，格式为：题目=答案
# 请注意：答案比较使用不区分大小写、且完全匹配（可按需改为包含匹配等）
questions:
  - "中国首都=北京"
  - "2+2=4=4"
  - "香蕉是什么颜色=黄色"
