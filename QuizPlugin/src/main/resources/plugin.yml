name: QuizPlugin
main: com.cubex.quiz.QuizPlugin
version: 1.0.0
description: 在聊天栏出题的抢答活动插件（支持 Vault 经济，集成人机验证）
authors:
  - Generated
depend: []
softdepend:
  - Vault

commands:
  letmeask:
    description: 管理答题活动（子命令: start|stop|question|reload|status）
    usage: /letmeask <start|stop|question|reload|status>
    permission: letmeask.admin

permissions:
  letmeask.admin:
    description: 管理 LetMeAsk 插件
    default: op
