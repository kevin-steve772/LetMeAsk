# LetMeAsk 基础配置
# payer: 扣款的玩家标识（支持以下格式）
#   - 玩家名（例如: Kevin）
#   - UUID（例如: 123e4567-e89b-12d3-a456-426614174000）
#   - littleskin:<uuid> 或 littleskin:<name>（如果你使用 LittleSkin 或类似插件）
#   - Server 或 Console 表示由服务器/控制台出资（请确保经济插件支持该标识）
# reward: 每题奖励金额
# question-interval-seconds: 自动出题间隔（秒）
# anti-bot-threshold-seconds: 回答速度（秒）小于等于该值会触发人机验证
# fuzzy-similarity-threshold: 0-1，答案相似度阈值，越高越严格

payer: Server
reward: 50.0
question-interval-seconds: 60
anti-bot-threshold-seconds: 1
fuzzy-similarity-threshold: 0.75
