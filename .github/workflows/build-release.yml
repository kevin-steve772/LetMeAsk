name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Resolve version
        id: version
        run: |
          base=$(grep -oPm1 '(?<=<revision>)[^<]+' pom.xml)
          sha=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "revision=${base}-${sha}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - name: Build with Maven
        run: mvn -B clean package -Drevision=${{ steps.version.outputs.revision }}

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (${{ steps.version.outputs.revision }})
          body: |
            自动构建（每次 push 到 main 触发）。

            版本: ${{ steps.version.outputs.revision }}（基础版本 ${{ steps.version.outputs.base }} + commit 短哈希）
            Commit: ${{ github.sha }}
            分支: ${{ github.ref_name }}
            时间: ${{ github.event.head_commit.timestamp }}
          files: target/*.jar
          prerelease: true
