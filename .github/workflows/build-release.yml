name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限：发布 release 只需 contents 写；actions/checkout 默认不再拿多余权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4.2.2，固定到 commit SHA（标签可被重指，SHA 不可变）
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up JDK 17
        # v4.7.1
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Resolve version
        id: version
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          base=$(grep -oPm1 '(?<=<revision>)[^<]+' pom.xml)
          # 版本号会进入 shell 与 release 资产名，先校验字符集，避免注入
          if ! [[ "$base" =~ ^[0-9A-Za-z._+-]+$ ]]; then
            echo "::error::pom.xml <revision> 含非法字符: $base"
            exit 1
          fi
          sha=${COMMIT_SHA:0:7}
          echo "revision=${base}-${sha}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - name: Build with Maven
        env:
          REVISION: ${{ steps.version.outputs.revision }}
        run: mvn -B clean package -Drevision="$REVISION"

      - name: Publish to rolling release
        # v2.2.1
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        with:
          tag_name: latest
          name: Latest build (${{ steps.version.outputs.revision }})
          body: |
            自动构建（每次 push 到 main 触发）。

            版本: ${{ steps.version.outputs.revision }}（基础版本 ${{ steps.version.outputs.base }} + commit 短哈希）
            Commit: ${{ github.sha }}
            分支: ${{ github.ref_name }}
            时间: ${{ github.event.head_commit.timestamp }}
          # shade 会在 target/ 留 original-*.jar 备份，只上传正式产物，避免同名插件冲突
          files: target/LetMeAsk-*.jar
          prerelease: true

      - name: Prune old rolling-release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_ASSET: LetMeAsk-${{ steps.version.outputs.revision }}.jar
        run: |
          keep="$KEEP_ASSET"
          assets=$(gh release view latest --json assets --jq '.assets[].name' || true)
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            [ "$name" = "$keep" ] && continue
            gh release delete-asset latest "$name" --yes || echo "Could not delete old asset: $name"
          done <<< "$assets"
