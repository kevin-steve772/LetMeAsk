version: 2
# 依赖与 Actions 定期更新：Actions 已固定到 commit SHA，由 Dependabot 负责跟进新版本
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
